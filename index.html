<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F0F4C3">
  <title>JOIN Απογραφή</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script>
    (function () {
      try {
        var dm = localStorage.getItem('darkMode');
        var legacy = localStorage.getItem('join_theme');
        if (legacy === 'dark' && dm !== 'true' && dm !== 'false') {
          localStorage.setItem('darkMode', 'true');
          localStorage.removeItem('join_theme');
          dm = 'true';
        } else if (legacy === 'light' && dm !== 'true' && dm !== 'false') {
          localStorage.setItem('darkMode', 'false');
          localStorage.removeItem('join_theme');
          dm = 'false';
        }
        var dark = dm === 'true';
        if (dark) document.body.classList.add('dark-mode');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? '#000000' : '#F0F4C3';
      } catch (e) {}
    })();
  </script>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
