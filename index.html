<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f1efeb">
  <meta name="description" content="Μηνιαία απογραφή για τα καταστήματα JOIN.">
  <title>JOIN Απογραφή</title>
  <!-- Manrope carries the Greek UI, JetBrains Mono every number and item code.
       Both are loaded from Google Fonts because this app ships as three static
       files with no build step to self-host with. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script>
    (function () {
      // Disable native restoration before the asynchronous app startup changes layout.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      try {
        var dm = localStorage.getItem('darkMode');
        var legacy = localStorage.getItem('join_theme');
        if (legacy === 'dark' && dm !== 'true' && dm !== 'false') {
          localStorage.setItem('darkMode', 'true');
          localStorage.removeItem('join_theme');
          dm = 'true';
        } else if (legacy === 'light' && dm !== 'true' && dm !== 'false') {
          localStorage.setItem('darkMode', 'false');
          localStorage.removeItem('join_theme');
          dm = 'false';
        }
        var dark = dm === 'true';
        if (dark) document.body.classList.add('dark-mode');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? '#121110' : '#f1efeb';
      } catch (e) {}
    })();
  </script>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
